# Qdrant vector database for the open-source Mem0 setup, exactly as
# in the video: `docker compose up -d`, then check the dashboard at
# http://localhost:6333/dashboard
#
# With Qdrant running, set QDRANT_HOST=localhost (see .env.example)
# and mem0_backend.py configures Mem0's vector_store to use it, so
# memories persist beyond a single session. Without this file the
# open-source Mem0 keeps memories in memory only.
services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: mem0_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data:
